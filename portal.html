<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Exclusivo Clientes | RIGANTI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg:#FAF9F6;--text:#0E1A2B;--gold:#8C7342;--line:rgba(14,26,43,0.12);--card:#16243D}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.portal-container{display:flex;width:100vw;min-height:100vh;background:#F9F6F0}
.portal-visual-side{flex:0 0 37%;min-height:100vh;background:#F9F6F0;position:sticky;top:0}
.portal-visual-side img{width:100%;height:100vh;object-fit:cover;object-position:center top;display:block}
.portal-form-side{flex:0 0 63%;min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:4vw}
.portal-wrapper{width:100%;max-width:420px;text-align:center}
.portal-logo{height:68px;margin:0 auto 28px;display:block;filter:brightness(0)}
.portal-header h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;margin-bottom:10px}
.portal-header h1 i{font-style:italic;color:var(--gold)}
.portal-header p{font-size:12.5px;color:rgba(14,26,43,0.55);line-height:1.5;margin-bottom:36px}
.portal-form{display:flex;flex-direction:column;gap:28px;text-align:left}
.form-group-privado{display:flex;flex-direction:column;position:relative}
.form-group-privado label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.form-group-privado input{border:none;border-bottom:1px solid var(--line);background:transparent;padding:10px 0;font-size:14.5px;outline:none}
.portal-asistencia{display:flex;justify-content:space-between;font-size:11.5px;margin-top:-10px}
.portal-link-secundario{color:rgba(14,26,43,0.5);text-decoration:none}
.btn-ingreso-privado{margin-top:10px;background:var(--text);color:#fff;border:1px solid var(--text);height:46px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.portal-footer{margin-top:48px;font-size:9.5px;letter-spacing:1px;color:rgba(14,26,43,0.35);text-transform:uppercase}
#error{color:#c0392b;font-size:12px;margin-top:12px;display:none;text-align:center}
#dashboard{display:none;width:100%;max-width:900px;text-align:left}
.tramite-row{background:#fff;border:1px solid var(--line);padding:22px 24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{font-size:9px;letter-spacing:2px;padding:6px 12px;border:1px solid var(--gold);color:var(--gold)}
.btn-pdf{color:var(--gold);text-decoration:none;font-size:11px;border:1px solid var(--line);padding:8px 14px}
  @media (max-width:900px){.portal-visual-side{display:none}.portal-form-side{flex:1 1 100%}}
</style>
</head>
<body>
  <div class="portal-container">
    <div class="portal-visual-side"><img src="hall-portal-riganti-final2.jpg" alt="Boceto RIGANTI"></div>
    <div class="portal-form-side">
      <div class="portal-wrapper" id="loginBox">
        <img src="logo-pluma-riganti-blanco-final.png" class="portal-logo" alt="RIGANTI">
        <div class="portal-header"><h1>Portal de <i>Clientes</i></h1><p>Entorno cifrado de seguridad jurídica confidencial</p></div>
        <form class="portal-form" onsubmit="event.preventDefault(); ingresar();">
          <div class="form-group-privado"><label>Identificación / DNI</label><input type="text" id="username" required placeholder="28079791" value="28079791"></div>
          <div class="form-group-privado"><label>Clave de Acceso</label><input type="password" id="password" required placeholder="DNI o riganti2026 para admin"></div>
          <div class="portal-asistencia"><a href="#" class="portal-link-secundario" onclick="alert('Contacte a la escribanía: info@riganti.com.ar')">¿Olvidó su contraseña?</a><a href="index.html" class="portal-link-secundario">← Volver</a></div>
          <button type="submit" class="btn-ingreso-privado"><span>Ingresar de forma segura</span> <i class="fa-solid fa-shield-halved"></i></button>
          <div id="error"></div>
        </form>
        <div class="portal-footer"><i class="fa-solid fa-lock"></i> Conexión encriptada SSL</div>
      </div>

      <div id="dashboard">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;flex-wrap:wrap;gap:12px">
          <div><h2 id="saludo" style="font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300"></h2><p style="font-size:12px;letter-spacing:2px;opacity:.5;margin-top:4px">EXPEDIENTES ACTIVOS</p></div>
          <a onclick="logout()" style="font-size:11px;letter-spacing:2px;opacity:.6;cursor:pointer;border:1px solid var(--line);padding:10px 18px">SALIR →</a>
        </div>
        <div id="listaTramites"></div>
        <div style="margin-top:32px;padding:20px;background:#fff;border:1px solid var(--line);font-size:11px;opacity:.6"><i class="fa-solid fa-lock" style="color:var(--gold)"></i> Documentación con validez legal. Consultas: info@riganti.com.ar</div>
      </div>

    </div>
  </div>
<script>
let db = [];
fetch('clientes.json?v='+Date.now()).then(r=>r.json()).then(j=>{db=j; let s=localStorage.getItem('riganti_sesion'); if(s){ document.getElementById('username').value=s; document.getElementById('password').value=s=='27027878'?'riganti2026':s; ingresar(); } }).catch(()=>{ db=JSON.parse(localStorage.getItem('riganti_db')||'[]'); });

function ingresar(){
 let dni = document.getElementById('username').value.trim();
 let pass = document.getElementById('password').value.trim();
 let error = document.getElementById('error');

 // ADMIN: 27027878 + riganti2026
 if(dni=='27027878' && pass=='riganti2026'){ window.location.href='admin.html'; return; }
 if(dni=='27027878' && pass!='riganti2026'){ error.style.display='block'; error.innerText='Clave admin incorrecta (riganti2026)'; return; }

 // CLIENTE: 28079791 (cualquier clave igual a DNI o vacía lo deja pasar para test)
 let cliente = db.filter(c=>String(c.dni).trim()==dni);
 if(cliente.length==0){ error.style.display='block'; error.innerText='DNI '+dni+' no encontrado en clientes.json'; return; }

 document.getElementById('loginBox').style.display='none';
 document.getElementById('dashboard').style.display='block';
 document.getElementById('saludo').innerHTML = `Hola, <i style="color:var(--gold);font-style:italic">${cliente[0].nombre}</i>`;
 document.getElementById('listaTramites').innerHTML = cliente.map(c=>`
   <div class="tramite-row">
     <div><div style="font-size:10px;letter-spacing:2px;opacity:.5;text-transform:uppercase">${c.tramite} · ${c.fecha||''}</div><div style="font-size:15px;margin-top:6px">${c.estado}</div><div style="font-size:12px;opacity:.5;margin-top:6px">${c.notas||''}</div></div>
     <div style="text-align:right">${c.pdf?`<a href="${c.pdf}" target="_blank" class="btn-pdf"><i class="fa-regular fa-file-pdf"></i> VER</a>`:'<span style="font-size:11px;opacity:.4">Sin archivo</span>'}<div style="margin-top:10px"><span class="badge">${c.estado.toUpperCase()}</span></div></div>
   </div>`).join('');
 localStorage.setItem('riganti_sesion',dni);
}
function logout(){ localStorage.removeItem('riganti_sesion'); location.reload(); }
</script>
</body>
</html>
