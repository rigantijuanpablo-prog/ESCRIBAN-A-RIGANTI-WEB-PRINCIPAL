<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | RIGANTI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FAF9F6;--text:#0E1A2B;--gold:#8C7342;--line:rgba(14,26,43,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.side{flex:0 0 37%;height:100vh;position:sticky;top:0;background:#F9F6F0}
.side img{width:100%;height:100%;object-fit:cover;display:block}
.main{flex:0 0 63%;padding:36px 42px;overflow-y:auto}
h1{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300}
h1 i{font-style:italic;color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.card{background:#fff;border:1px solid var(--line);padding:22px;text-decoration:none;color:var(--text);display:block;transition:.2s}
.card:hover{border-color:var(--gold)}
.card span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:8px}
.card b{font-size:15px;font-weight:500}
.box{background:#fff;border:1px solid var(--line);padding:24px;margin-top:18px}
input,select,textarea{width:100%;border:none;border-bottom:1px solid var(--line);padding:10px 0;margin-top:8px;outline:none;font-size:14px;background:transparent}
.btn{background:var(--text);color:#fff;border:0;padding:12px 18px;font-size:10px;letter-spacing:2px;cursor:pointer;margin-top:14px}
@media(max-width:900px){.side{display:none}.main{flex:1}}
</style>
</head>
<body>
<div class="side"><img src="hall-portal-riganti-final2.jpg"></div>
<div class="main">
<div style="display:flex;justify-content:space-between;align-items:center"><h1>Panel <i>Admin</i></h1><a href="portal.html" style="font-size:10px;border:1px solid var(--line);padding:8px 14px;text-decoration:none;color:var(--text)">SALIR</a></div>
<p style="font-size:11px;opacity:.5;margin-top:6px;letter-spacing:1px">ADMIN: 27027878 · Acceso maestro</p>

<div class="grid">
<a class="card" href="tramite.html"><span><i class="fa-regular fa-file"></i> Documentación</span><b>Trámites + PDFs</b><p style="font-size:11px;opacity:.5;margin-top:6px">Cargar escrituras, ver estados</p></a>
<a class="card" href="boveda.html"><span><i class="fa-solid fa-vault"></i> Bóveda</span><b>Turnos y Presupuestos</b><p style="font-size:11px;opacity:.5;margin-top:6px">Liquidación y cajas</p></a>
<a class="card" href="mensajes.html"><span><i class="fa-regular fa-envelope"></i> Consultas</span><b>Mensajes Web</b><p style="font-size:11px;opacity:.5;margin-top:6px">Formularios de index.html</p></a>
<a class="card" href="clientes.json" target="_blank"><span><i class="fa-solid fa-database"></i> Base</span><b>clientes.json</b><p style="font-size:11px;opacity:.5;margin-top:6px">Ver base de DNIs</p></a>
</div>

<div class="box">
<h3 style="font-family:'Cormorant Garamond';font-size:20px">Carga rápida de cliente (para 28079791)</h3>
<input id="dni" placeholder="DNI ej: 28079791">
<input id="nombre" placeholder="Nombre ej: Juan Pablo Riganti">
<input id="tramite" placeholder="Trámite ej: Compraventa inmueble">
<select id="estado"><option>En proceso</option><option>Observado</option><option>Firmado</option><option>Entregado</option></select>
<input id="pdf" placeholder="Link PDF (drive) o vacio">
<input id="fecha" type="date">
<textarea id="notas" placeholder="Notas internas"></textarea>
<button class="btn" onclick="guardar()">GUARDAR EN NAVEGADOR + GENERAR JSON</button>
<p id="msg" style="font-size:11px;margin-top:12px;opacity:.6"></p>
</div>

<div class="box" id="listaBox"></div>

</div>
<script>
if(localStorage.getItem('riganti_sesion')!='27027878'){ /* si no es admin lo saco */ }
let db=JSON.parse(localStorage.getItem('riganti_db')||'[]');
fetch('clientes.json?v='+Date.now()).then(r=>r.json()).then(j=>{ if(db.length==0) db=j; render(); });
function guardar(){
 let o={dni:document.getElementById('dni').value.trim(),nombre:document.getElementById('nombre').value.trim(),tramite:document.getElementById('tramite').value.trim(),estado:document.getElementById('estado').value,fecha:document.getElementById('fecha').value,pdf:document.getElementById('pdf').value.trim(),notas:document.getElementById('notas').value.trim()};
 if(!o.dni||!o.nombre){alert('Falta DNI y nombre');return;}
 db.push(o); localStorage.setItem('riganti_db',JSON.stringify(db));
 document.getElementById('msg').innerText='Guardado local. Copiá esto y pegalo en clientes.json de GitHub: '+JSON.stringify(db,null,2).substring(0,120)+'...';
 render();
}
function render(){
 document.getElementById('listaBox').innerHTML='<b style=font-size:12px;letter-spacing:1px>CLIENTES CARGADOS ('+db.length+')</b><div style=margin-top:12px>'+db.map(c=>`<div style=padding:10px 0;border-bottom:1px solid var(--line);font-size:13px>${c.dni} - ${c.nombre} - ${c.tramite} - <i style=color:var(--gold)>${c.estado}</i></div>`).join('')+'</div><button class=btn onclick="descargar()">DESCARGAR clientes.json</button>';
}
function descargar(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='clientes.json'; a.click();
}
</script>
</body>
</html>
