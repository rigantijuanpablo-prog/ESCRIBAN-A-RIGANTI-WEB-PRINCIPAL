<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--text:#0E1A2B;--gold:#8C7342;--line:rgba(14,26,43,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex}
.side{flex:0 0 28%;height:100vh;position:sticky;top:0}.side img{width:100%;height:100%;object-fit:cover}
.main{flex:1;padding:40px 50px}
h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300} h1 i{font-style:italic;color:var(--gold);font-weight:300}
.top{font-size:10px;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
.btn{border:1px solid var(--line);padding:10px 18px;font-size:10px;letter-spacing:2px;background:#fff;cursor:pointer;text-decoration:none;color:var(--text)}
.card{background:#fff;border:1px solid var(--line);padding:22px;margin-top:16px;display:flex;justify-content:space-between}
.badge{background:#0E1A2B;color:#fff;font-size:9px;padding:6px 10px;letter-spacing:1px}
</style>
</head>
<body>
<div class="side"><img src="hall-portal-riganti-final2.jpg"></div>
<div class="main">
<div class="top"><span>EXPEDIENTES ACTIVOS</span><a class="btn" href="portal.html">SALIR →</a></div>
<h1 id="h1">Hola, <i>Juan Pablo Riganti</i></h1>
<div id="lista" style="margin-top:30px"></div>
<div style="margin-top:30px;background:#fff;border:1px solid var(--line);padding:16px;font-size:12px;opacity:.6">🔒 Documentación con validez legal. Consultas: info@riganti.com.ar</div>
</div>
<script>
let dni = localStorage.getItem('riganti_sesion')||'28079791';
fetch('clientes.json?v='+Date.now()).then(r=>r.json()).then(data=>{
 let cli = data.find(c=>c.dni==dni);
 if(!cli){ // formato viejo con repetidos
   let arr = data.filter(c=>c.dni==dni);
   cli = {nombre:arr[0]?.nombre||'Juan Pablo Riganti', tramites: arr.map(a=>({tipo:a.tramite||a.tipo, estado:a.estado, notas:a.notas, fecha:a.fecha}))};
 }
 document.getElementById('h1').innerHTML=`Hola, <i>${cli.nombre}</i>`;
 let tramites = cli.tramites||[];
 if(tramites.length==0 && cli.tramite) tramites=[cli]; // fallback
 document.getElementById('lista').innerHTML = tramites.map(t=>`
   <div class=card>
     <div><div style="font-weight:500">${t.tipo||t.tramite}</div><div style="font-size:11px;opacity:.6;margin-top:6px">${t.notas||''}<br>${t.fecha||''}</div>
     <div style="margin-top:12px;display:flex;gap:8px"><a class=btn href="tramite.html">REQUISITOS</a><a class=btn href="boveda.html">PRESUPUESTO / TURNO</a><a class=btn href="mensajes.html">MENSAJES</a></div>
     </div><div><span class=badge>${(t.estado||'EN CURSO').toUpperCase()}</span></div>
   </div>`).join('') || '<div style=opacity:.5>No hay trámites cargados para '+dni+'</div>';
}).catch(e=>{document.getElementById('lista').innerHTML='Error clientes.json: '+e});
</script>
</body>
</html>
