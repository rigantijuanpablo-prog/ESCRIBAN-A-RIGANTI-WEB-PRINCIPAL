<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Escritura | RIGANTI NIVEL 3</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#FAF9F6;--text:#0E1A2B;--gold:#8C7342;--line:rgba(14,26,43,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.side{flex:0 0 38%;height:100vh;position:sticky;top:0}
.side img{width:100%;height:100%;object-fit:cover}
.main{flex:1;padding:32px 36px;overflow-y:auto}
.top{font-size:9px;letter-spacing:2.5px;display:flex;justify-content:space-between;opacity:.6;margin-bottom:28px}
h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;line-height:1} h1 i{font-style:italic;color:var(--gold)}
.sub{font-size:11px;opacity:.5;margin-top:10px;letter-spacing:1px}
.card{background:#fff;border:1px solid var(--line);padding:22px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
.card b{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400}
.badge{font-size:9px;letter-spacing:2px;border:1px solid var(--line);padding:6px 10px}
.badge.gold{border-color:var(--gold);color:var(--gold)}
.badge.done{background:var(--text);color:#fff}
.meta{font-size:11px;opacity:.6;margin-top:6px}
</style>
</head>
<body>
<div class="side"><img src="hall-portal-riganti-final2.jpg"></div>
<div class="main">
<div class="top"><span>ESCRIBANÍA RIGANTI — NIVEL 3 SEGURO</span><a href="portal.html" style="text-decoration:none;color:var(--text);border:1px solid var(--line);padding:6px 10px">SALIR</a></div>
<h1 id="nombre">Cargando <i>trámites...</i></h1>
<div class="sub" id="dniTxt">Consultando Firebase privado</div>

<div id="lista" style="margin-top:28px"></div>

<div id="vacio" style="display:none;margin-top:30px;background:#fff;border:1px dashed var(--gold);padding:20px;font-size:12px;line-height:1.6">
No encontramos trámites activos con ese DNI. Contactá a la escribanía.
</div>
</div>

<script>
const firebaseConfig = {
  // PEGA ACA TU CONFIG DE FIREBASE
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function init(){
 let dni = localStorage.getItem('riganti_dni') || new URLSearchParams(window.location.search).get('dni');
 if(!dni){ window.location.href='portal.html'; return; }
 document.getElementById('dniTxt').innerText='DNI '+dni+' · Firebase Privado';
 try{
  let doc = await db.collection('clientes').doc(dni).get();
  if(!doc.exists){ document.getElementById('vacio').style.display='block'; document.getElementById('nombre').innerHTML='Sin <i>resultados</i>'; return; }
  let c = doc.data();
  document.getElementById('nombre').innerHTML = `${c.nombre} <i>— trámites</i>`;
  let tramites = c.tramites || [];
  if(tramites.length==0){ document.getElementById('vacio').style.display='block'; return; }
  document.getElementById('lista').innerHTML = tramites.map(t=>{
    let badgeClass = t.estado.includes('Listo') ? 'badge done' : t.estado.includes('Escriturado') ? 'badge gold' : 'badge';
    return `<div class=card>
      <div><b>${t.tipo}</b><div class=meta>${t.notas||''} · ${t.fecha||''}</div></div>
      <div style="text-align:right"><div class="${badgeClass}">${t.estado.toUpperCase()}</div>${t.pdf?`<div style="margin-top:8px"><a href="${t.pdf}" target="_blank" style="font-size:10px;letter-spacing:2px;color:var(--gold);text-decoration:none">VER PDF →</a></div>`:''}</div>
    </div>`;
  }).join('');
 }catch(e){ console.error(e); alert('Error Firebase: '+e.message); }
}
init();
</script>
</body>
</html>
