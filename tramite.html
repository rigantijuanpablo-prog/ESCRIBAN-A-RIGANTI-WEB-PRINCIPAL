<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Documental | RIGANTI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--text:#0E1A2B;--gold:#8C7342;--line:rgba(14,26,43,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.side{flex:0 0 37%;height:100vh;position:sticky;top:0;background:#F9F6F0}
.side img{width:100%;height:100%;object-fit:cover;display:block}
.main{flex:0 0 63%;padding:32px 44px}
.bread{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;margin-bottom:18px}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300}
.sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin-top:8px}
.req-title{font-size:10px;letter-spacing:2px;margin:28px 0 16px;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.item-left{display:flex;gap:14px;align-items:center}
.icon{width:28px;height:28px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px}
.badge{font-size:8.5px;letter-spacing:1px;padding:6px 10px;font-weight:600}
.aprobado{background:#D4E8E0;color:#1A5C3A}.revision{background:#FFF3CD;color:#8A6D00}.rechazado{background:#FADBD8;color:#922B21}
.obs{background:#FDF0F0;border-left:3px solid #E74C3C;padding:12px;margin-top:10px;font-size:11px}
</style>
</head>
<body>
<div class="side"><img src="hall-portal-riganti-final2.jpg"></div>
<div class="main">
<div class="bread"><a href="admin.html" style="color:inherit">← Dashboard</a> / Gestión Documental</div>
<h1 id="tituloTramite">Escritura Compraventa Mat. 15-4321</h1>
<div class="sub" id="subTramite">AV. ALVEAR 1890 - CHECKLIST DE REQUISITOS SEGÚN ACTO</div>

<div class="req-title">REQUISITOS SOLICITADOS POR LA ESCRIBANÍA</div>
<div id="checklist"></div>

<div style="margin-top:30px;padding:20px;background:#fff;border:1px solid var(--line)">
<h4 style="font-size:12px;letter-spacing:1px">Panel Escribano (solo admin 27027878)</h4>
<select id="tipoDoc" style="width:100%;margin-top:12px;padding:8px"><option>DNI frente y dorso - Comprador</option><option>Constancia de CUIT / CUIL</option><option>Título de Propiedad Antecedente</option><option>Impuesto ABL / Rentas - Última boleta paga</option></select>
<select id="estadoDoc" style="width:100%;margin-top:8px;padding:8px"><option value="aprobado">APROBADO</option><option value="revision">EN REVISIÓN POR ESCRIBANO</option><option value="rechazado">RECHAZADO - VER OBSERVACIÓN</option></select>
<input id="obsInput" placeholder="Observación si es rechazado" style="width:100%;margin-top:8px;padding:8px">
<button onclick="agregar()" style="margin-top:12px;background:#0E1A2B;color:#fff;padding:10px 16px;font-size:10px;letter-spacing:2px;border:0;cursor:pointer">ACTUALIZAR ESTADO</button>
</div>
</div>

<script>
let docs=JSON.parse(localStorage.getItem('riganti_docs')||'[{"nombre":"DNI frente y dorso - Comprador","desc":"PDF o foto legible, no vencido","estado":"aprobado"},{"nombre":"Constancia de CUIT / CUIL","desc":"AFIP actualizada","estado":"aprobado"},{"nombre":"Título de Propiedad Antecedente","desc":"Escritura anterior del inmueble","estado":"revision"},{"nombre":"Impuesto ABL / Rentas - Última boleta paga","desc":"Debe verse la nomenclatura catastral completa","estado":"rechazado","obs":"La boleta está cortada. Por favor subir foto completa donde se lea partida 023-45678."}]');
function render(){
document.getElementById('checklist').innerHTML=docs.map(d=>`
<div class="item"><div class="item-left"><div class="icon"><i class="fa-regular fa-file"></i></div><div><div style="font-size:13px">${d.nombre}</div><div style="font-size:11px;opacity:.5;margin-top:4px">${d.desc}</div>${d.obs?`<div class=obs>Observación escribana: ${d.obs}</div>`:''}</div></div><div><span class="badge ${d.estado}">${d.estado=='aprobado'?'APROBADO':d.estado=='revision'?'EN REVISIÓN POR ESCRIBANO':'RECHAZADO - VER OBSERVACIÓN'}</span></div></div>`).join('');
}
function agregar(){
let n=document.getElementById('tipoDoc').value;let e=document.getElementById('estadoDoc').value;let o=document.getElementById('obsInput').value;
let idx=docs.findIndex(d=>d.nombre==n);if(idx>=0){docs[idx].estado=e;docs[idx].obs=o;}else{docs.push({nombre:n,desc:'Requisito adicional',estado:e,obs:o});}
localStorage.setItem('riganti_docs',JSON.stringify(docs));render();
}
render();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</body>
</html>
